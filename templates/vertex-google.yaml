apiVersion: agentic.openshift.io/v1alpha1
kind: LLMProvider
metadata:
  name: vertex-google
spec:
  type: GoogleCloudVertex
  googleCloudVertex:
    projectID: "${VERTEX_PROJECT}"
    region: "${VERTEX_REGION}"
    modelProvider: Google
    credentialsSecret:
      name: llm-creds-vertex
---
apiVersion: agentic.openshift.io/v1alpha1
kind: Agent
metadata:
  name: default
spec:
  llmProvider:
    name: vertex-google
  model: "${VERTEX_MODEL}"
  timeouts:
    analysisSeconds: 300
    executionSeconds: 600
    verificationSeconds: 300
---
apiVersion: agentic.openshift.io/v1alpha1
kind: Agent
metadata:
  name: smart
spec:
  llmProvider:
    name: vertex-google
  model: "${VERTEX_MODEL}"
  timeouts:
    analysisSeconds: 300
    executionSeconds: 600
    verificationSeconds: 300
---
apiVersion: agentic.openshift.io/v1alpha1
kind: Agent
metadata:
  name: fast
spec:
  llmProvider:
    name: vertex-google
  model: "${VERTEX_MODEL}"
  timeouts:
    analysisSeconds: 300
    executionSeconds: 600
    verificationSeconds: 300
